name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "17"
      - run: mvn -B verify

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t credit-simulator:ci .
      - name: Login to Docker Hub
        if: secrets.DOCKERHUB_USERNAME != ''
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
      - name: Push to Docker Hub
        if: secrets.DOCKERHUB_USERNAME != ''
        run: |
          docker tag credit-simulator:ci "${{ secrets.DOCKERHUB_USERNAME }}/credit-simulator:latest"
          docker tag credit-simulator:ci "${{ secrets.DOCKERHUB_USERNAME }}/credit-simulator:${{ github.sha }}"
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/credit-simulator:latest"
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/credit-simulator:${{ github.sha }}"
