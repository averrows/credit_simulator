name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "17"
      - run: mvn -B verify

  docker:
    runs-on: ubuntu-latest
    needs: build
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t credit-simulator:ci .
      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        run: echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
      - name: Push to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        run: |
          docker tag credit-simulator:ci "${DOCKERHUB_USERNAME}/credit-simulator:latest"
          docker tag credit-simulator:ci "${DOCKERHUB_USERNAME}/credit-simulator:${{ github.sha }}"
          docker push "${DOCKERHUB_USERNAME}/credit-simulator:latest"
          docker push "${DOCKERHUB_USERNAME}/credit-simulator:${{ github.sha }}"
